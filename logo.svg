<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c6dfa"/>
      <stop offset="100%" stop-color="#5646eb"/>
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dark PWA rounded icon background -->
  <rect width="512" height="512" rx="112" fill="#090d16"/>

  <!-- Main Purple/Indigo Circle -->
  <circle cx="256" cy="256" r="200" fill="url(#circleGrad)" filter="url(#dropShadow)"/>

  <!-- Crisp White Lightning Bolt Icon -->
  <path d="M280 96 L160 276 L250 276 L232 416 L352 236 L262 236 Z" 
        fill="#ffffff" 
        filter="url(#boltGlow)"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linejoin="round"
        stroke-linecap="round"/>
</svg>